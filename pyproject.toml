[project]
name = "agents-workspace"
version = "0.2.0"
description = "Multi-agent workspace for CNC machining analysis and scheduling"
requires-python = ">=3.11"
dependencies = [
    "gcodeparser>=0.3.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pytest-cov>=7.0.0",
    "radon>=6.0.1",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.24",
    "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.uv.workspace]
members = [
    "agents/gcode-parser",
    "agents/cam-runner",
    "agents/cell-scheduler",
    "agents/cell-schedule-visualizer",
    "agents/cell-mes",
    "agents/nl-router",
    "agents/digital-thread-project-manager",
    "agents/monitoring-data-replayer",
    "agents/step-pmi-reader",
    "agents/torus-mock",
    "agents/agent-orchestrator",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = [".", "shared", "agents/agent-orchestrator/src"]
markers = [
    "integration: marks tests as integration tests requiring running services",
    "unit: marks tests as unit tests (no external dependencies)",
    "e2e: marks tests as end-to-end tests",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 100

