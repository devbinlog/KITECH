[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monitoring-data-replayer"
version = "0.1.0"
description = "CNC monitoring data replay agent for TDMS and LOG files"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "nptdms>=1.7.0",
    "pandas>=2.0.0",
    "websockets>=12.0",
    "aiofiles>=23.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24",
    "black>=23.0",
    "mypy>=1.0",
]

[project.scripts]
monitoring-data-replayer = "src.service:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "../..", "../../shared"]
