[project]
name = "cell-scheduler"
version = "0.2.0"
description = "Manufacturing Cell Scheduling Agent with Multi-Solver Support"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Manufacturing Intelligence", email = "dev@example.com"}
]

dependencies = [
    "ortools>=9.7.2996",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "httpx>=0.26.0",
    "alns>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
