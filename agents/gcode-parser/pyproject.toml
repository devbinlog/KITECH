[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcode-parser-agent"
version = "0.1.0"
description = "G-code parsing and analysis agent"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "gcodeparser>=0.3.0",
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "starlette>=0.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "httpx>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
