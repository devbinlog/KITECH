[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cell-schedule-visualizer"
version = "0.1.0"
description = "Interactive visualization for manufacturing cell schedules"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Manufacturing Intelligence Team"}
]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "matplotlib>=3.8.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/your-org/agents-workspace"

[tool.hatch.build.targets.wheel]
packages = ["src"]
