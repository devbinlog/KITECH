[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cam-runner-agent"
version = "0.1.0"
description = "CAM cutting parameter analysis agent"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "opencamlib>=0.2.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
